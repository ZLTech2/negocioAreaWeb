<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Negócio na Área</title>
    <link rel="stylesheet" href="./assets/css/styles-login.css">
    <link rel="shortcut icon" href="./assets/images/logo_rd-removebg-preview.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <header>
        <nav>
            <div class="nav-list">
                <div class="logo">

                    <a href="./index.html">
                        <img src="./assets/images/logo_rd-removebg-preview.png" alt="Logo Negócio na Área">
                    </a>
                </div>

                <div class="hamburguer" id="hamburguer">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <ul class="menu" id="menu">
                    <li><a href="https://site-zl-tech.vercel.app/" target="_blank">ZL Tech</a></li>
                    <li><a href="./tipo_cadastro.html">Cadastrar</a></li>
                    <li><a href="./login.html">Entrar</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container-form">
            <!-- CORRIGIDO: id="loginForm" para bater com login.js -->
            <form method="post" id="loginForm">
                <div class="campos">

                    <div class="input-label">
                        <label for="login_email">Email</label>
                        <!-- CORRIGIDO: id="login_email" para bater com login.js -->
                        <input type="email" name="email" id="login_email" placeholder="example@gmail.com" required>
                    </div>

                    <div class="input-label">
                        <label for="login_senha">Senha</label>
                        <!-- CORRIGIDO: id="login_senha" para bater com login.js -->
                        <input type="password" name="senha" id="login_senha" placeholder="Informe sua senha" required>
                    </div>
                </div>

                <!-- CORRIGIDO: id="login_msg" para bater com login.js -->
                <div class="msg" id="login_msg"></div>

                <div class="input-label">
                    <button type="submit">Entrar</button>

                    <p style="margin-top: 30px;">
                        Não possui conta?
                        <a href="./empresa/cadastro_empresa.html">Clique aqui para cadastrar</a>
                    </p>
                </div>
            </form>
        </div>
    </main>

    <script src="./assets/js/login.js" defer></script>
    <script src="./assets/js/menu.js"></script>
</body>

</html>
