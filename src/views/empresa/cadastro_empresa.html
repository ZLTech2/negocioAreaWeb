<body>
    <header>
        <nav>
            <div class="nav-list">
                <div class="logo">
                    <a href="../../../public/index.html"><img src="../../../public/assets/images/logo rd (1).png"
                            alt=""></a>

                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div class="container-form">
            <form method="post" id="form">
                <div class="campos">
                    <div class="input-label">
                        <label for="cnpj"> CNPJ</label>
                        <input type="text" name="cnpj" id="cnpj" maxlength="18" placeholder="00.000.000/0000-00"
                            required>
                    </div>

                    <div class="input-label">
                        <label for="nomeEmpresa">Nome</label>
                        <input type="text" name="nomeEmpresa" id="nome" placeholder="Digite o nome da empresa" required>
                    </div>

                    <div class="input-label">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                    </div>

                    <div class="input-label">
                        <label for="telefone">Telefone</label>
                        <input type="tel" name="telefone" id="telefone" placeholder="(00) 00000-0000" maxlength="15"
                            required>
                    </div>

                    <div class="input-label">
                        <label for="descricao">Descrição</label>
                        <input type="text" name="descricao" id="descricao" placeholder="Ex: loja de roupas" required>
                    </div>

                    <div class="input-label">
                        <label for="descricao">Categoria</label>
                        <select name="categoria" id="">
                            <option value="">Selecione a categoria</option>
                            <option value="roupas">Loja de roupas</option>
                            <option value="eletronicos">Eletrônicos</option>
                            <option value="alimentos">Alimentícios</option>
                        </select>
                    </div>

                    <div class="input-label">
                        <label for="cep">CEP</label>
                        <input type="text" name="cep" id="cep" maxlength="9" placeholder="00000-000" required>
                    </div>
                    
                    <div class="input-label">
                        <label for="Rua">Rua</label>
                        <input type="text" name="rua" id="rua" placeholder="Rua"  class="input-bloqueado" required readonly>
                    </div>
                    

                    <div class="input-label">
                        <label for="bairro">Bairro</label>
                        <input type="text" name="bairro" id="bairro" placeholder="Bairro"  class="input-bloqueado" required readonly>
                    </div>

                    <div class="input-label">
                        <label for="numero">Número</label>
                        <input type="text" name="numero" id="numero" placeholder="00" required>
                    </div>

                    <div class="input-label">
                        <label for="cidade">Cidade</label>
                        <input type="text" name="cidade" id="cidade" placeholder="Cidade"  class="input-bloqueado" required readonly >
                    </div>

                    <div class="input-label">
                        <label for="cidade">Estado</label>
                        <input type="text" name="uf" id="uf" placeholder="Estado"  class="input-bloqueado" required readonly>
                    </div>

                    <div class="input-label">
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" id="senha" placeholder="Informe sua senha" required>
                    </div>

                    <div class="input-label">
                        <label for="confirmar_senha">Confirmação de senha</label>
                        <input type="password" name="confirmar_senha" id="confirmar_senha"
                            placeholder="Confirme sua senha" required>
                    </div>


                </div>
                <div class="msg" id="msg"></div>
                <div class="input-label">
                    <button type="submit">Cadastrar</button>
                    <p>Já tem uma conta? <a href="../login.html"> Clique aqui para entrar</a></p>
                </div>

        </div>

        </form>
        </div>

        <!-- <footer>
            <p>redes sociais</p>

    </main>
